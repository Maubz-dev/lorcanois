<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ink Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&display=swap" rel="stylesheet">
<style>

:root{color-scheme:dark;--bg:#0f0b1e;--panel:#1a1433;--line:#332a57;--text:#f2ecff;--muted:#a79cc9;--gold:#e8b84a;--purple:#7b4fd6;--green:#4fbf8a}
*{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 40px}
header{text-align:center;margin-bottom:24px}
h1{margin:0;font-size:clamp(1.6rem,4vw,2.2rem);color:var(--gold);letter-spacing:.5px}
.sub{color:var(--muted);margin:6px 0 0}
h2{font-size:1.25rem;margin:28px 0 12px;color:var(--gold);border-bottom:1px solid var(--line);padding-bottom:6px}
h3{font-size:1rem;margin:0 0 10px;color:var(--muted);font-weight:600}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
.setup{display:grid;gap:16px;max-width:520px;margin:0 auto}
.pl{display:grid;gap:8px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.pl:last-of-type{border-bottom:0}
label{font-size:.9rem;color:var(--muted);display:block;margin-bottom:2px}
input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:1rem}
input:focus{outline:2px solid var(--purple);border-color:transparent}
.inks{display:flex;flex-wrap:wrap;gap:6px}
.ink{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:999px;padding:6px 12px;font-size:.85rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.ink.on{border-color:var(--gold);font-weight:700}
.ink:disabled{opacity:.35;cursor:not-allowed}
.btn{background:linear-gradient(135deg,var(--purple),#9b6bf0);color:#fff;border:0;border-radius:10px;padding:11px 18px;font-size:1rem;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn:hover{filter:brightness(1.08)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.card.fin{border-color:var(--gold)}
.card.pending{opacity:.55}
.card .lbl{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0}
.name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{display:inline-block;width:20px;height:20px;margin-right:4px;vertical-align:middle;background-size:contain;background-repeat:no-repeat;background-position:center}
.ico{width:22px;height:22px;object-fit:contain}
.score{display:flex;align-items:center;gap:8px}
.score button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:1.1rem;cursor:pointer}
.score button:disabled{opacity:.35;cursor:not-allowed}
.score .v{min-width:20px;text-align:center;font-size:1.3rem;font-weight:700;color:var(--gold)}
.win{margin:10px 0 0;color:var(--green);font-weight:600}
.link{background:none;border:0;color:var(--muted);font-size:.8rem;cursor:pointer;padding:8px 0 0;text-decoration:underline}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 8px;text-align:center;border-bottom:1px solid var(--line)}
th{font-size:.8rem;color:var(--muted);font-weight:600;text-transform:uppercase}
td.l,th.l{text-align:left}
tr.top td{color:var(--gold);font-weight:700}
.bracket{display:grid;gap:14px;grid-template-columns:1fr 1fr}
.bracket .full{grid-column:1/-1}
@media (max-width:600px){.bracket{grid-template-columns:1fr}}
.note{color:var(--muted);font-size:.85rem;margin-top:10px}
.dd{position:relative}
.dd-btn{display:flex;align-items:center;gap:6px;min-height:46px;width:100%;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);cursor:pointer}
.dd-btn .ico{width:26px;height:26px}
.dd-ph{color:var(--muted);font-size:.95rem}
.caret{margin-left:auto;color:var(--muted)}
.dd-menu{position:absolute;z-index:5;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;display:grid;grid-template-columns:repeat(6,1fr);gap:6px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.ico-btn{border:1px solid transparent;background:var(--bg);border-radius:10px;padding:6px;cursor:pointer;display:flex;justify-content:center}
.ico-btn.on{border-color:var(--c);box-shadow:0 0 0 2px var(--c) inset}
.ico-btn:disabled{opacity:.35;cursor:not-allowed}
.ico-btn .ico{width:34px;height:34px}
@media (max-width:480px){.dd-menu{grid-template-columns:repeat(3,1fr)}}
.lore{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.lrow{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:.9rem}
.lrow input{width:70px;padding:6px 8px;font-size:.95rem}
.lbtns{display:flex;gap:12px}
select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:1rem}
.fsel{display:inline-flex;align-items:center;gap:6px;font-size:.9rem;color:var(--muted)}
.fsel select{width:auto;padding:8px 10px;font-size:.95rem}

.setup select{margin-bottom:4px}
.lore{margin-top:12px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px}
.lhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.ltitle{font-size:.75rem;text-transform:uppercase;letter-spacing:.6px;color:var(--gold);font-weight:700}
.lnames{font-size:.8rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.lgame{display:grid;grid-template-columns:22px 1fr auto 1fr 28px;align-items:center;gap:6px;margin:6px 0}
.lnum{font-size:.8rem;color:var(--muted);text-align:center}
.lvs{font-size:.75rem;color:var(--muted);text-align:center}
.lstep{display:flex;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
.lstep button{width:36px;height:38px;flex:0 0 36px;border:0;background:transparent;color:var(--text);font-size:1.2rem;cursor:pointer}
.lstep button:hover{background:var(--line)}
.lstep input{width:100%;min-width:0;text-align:center;border:0;background:transparent;padding:6px 0;font-size:1.05rem;font-weight:700;color:var(--gold);-moz-appearance:textfield}
.lstep input::-webkit-outer-spin-button,.lstep input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.lstep input:focus{outline:none}
.lx{width:28px;height:28px;border:0;border-radius:50%;background:transparent;color:var(--muted);cursor:pointer}
.lx:hover{color:#e0666b;background:var(--line)}
.ladd{width:100%;margin-top:6px;padding:8px;border:1px dashed var(--line);border-radius:10px;background:transparent;color:var(--muted);cursor:pointer}
.ladd:hover{color:var(--text);border-color:var(--purple)}
.ltot{margin-top:6px;text-align:right;font-size:.85rem;color:var(--muted)}
.champ{text-align:center;border-color:var(--gold);margin:0 0 14px}
.ctitle{color:var(--gold);font-weight:700;letter-spacing:.5px}
.cname{font-size:1.4rem;font-weight:700;margin:6px 0 10px}
.cbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.hist{margin-top:24px}
.palm{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.pill{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:.85rem}
.hitem{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;padding:10px 12px;background:var(--bg)}
.hitem summary{display:flex;gap:12px;align-items:center;flex-wrap:wrap;cursor:pointer;list-style:none}
.hdate{color:var(--muted);font-size:.85rem}
.hwin{font-weight:700;color:var(--gold)}
.hnp{color:var(--muted);font-size:.85rem;margin-left:auto}
.tablewrap{overflow-x:auto;margin-top:8px}
.fwwrap{position:fixed;inset:0;z-index:999;background:rgba(10,8,20,.35);cursor:pointer;overflow:hidden}
.fwwrap canvas{position:absolute;inset:0;width:100%;height:100%}
.fwmsg{position:absolute;left:0;right:0;top:38%;text-align:center;font-size:clamp(2rem,8vw,4.5rem);font-weight:800;color:var(--gold);text-shadow:0 4px 24px rgba(0,0,0,.7);animation:fwpop .9s ease-out both;pointer-events:none}
.fwhint{position:absolute;left:0;right:0;bottom:24px;text-align:center;color:#f2ecff;opacity:.7;font-size:.9rem;pointer-events:none}
@keyframes fwpop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.brand{background:none;border:0;cursor:pointer;display:inline-flex;flex-direction:row;align-items:center;gap:14px;padding:4px 8px;color:var(--text)}
.brand:hover .brandtxt{opacity:.85}
.logo{display:block;width:64px;height:64px;flex:0 0 64px}
.logo img{width:100%;height:100%;display:block;border-radius:50%}
.brandtxt{font-family:'Cinzel',Georgia,'Times New Roman',serif;font-size:clamp(1.5rem,4vw,2.1rem);font-weight:800;color:var(--gold);letter-spacing:.12em;text-transform:uppercase}
.btn.danger{background:transparent;color:#e0666b;border:1px solid #e0666b}
.btn.danger:hover{background:rgba(224,102,107,.12);filter:none}
.resetbar{display:flex;justify-content:flex-end;margin-bottom:10px}
</style>
</head>

// L'état est enregistré sous forme de texte JSON : évite les soucis des tableaux avec des cases vides
function snapshotState(){
  return JSON.parse(JSON.stringify({NP, NAMES, PICK, P, DECKS, POULE, ROUND, S, GL, TBO, FMT, started, ORG}));
}
function applyState(d){
  NP = d.NP ?? 4;
  NAMES = d.NAMES || []; PICK = d.PICK || []; fitSetup();
  P = d.P || []; DECKS = d.DECKS || []; POULE = d.POULE || []; ROUND = d.ROUND || [];
  S = d.S || {}; GL = d.GL || {}; TBO = d.TBO || {};
  FMT = d.FMT || {p:1, a:3};
  started = !!d.started;
  ORG = d.ORG || null;
}
function saveRemote(){
  if(!DOC || !FB_SET) return;
  const raw = JSON.stringify(snapshotState());
  if(raw === lastWritten) return;
  lastWritten = raw;
  FB_SET(DOC, raw).catch(e => console.warn('Écriture échouée', e));
}

// ---------- utilitaires ----------
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function sc(k){return S[k]||{a:0,b:0};}
function target(k){
  const isPoule = (k[0]==='p' || k.startsWith('tb-'));
  return isPoule ? Math.floor(FMT.p/2)+1 : Math.floor(FMT.a/2)+1;
}
function done(k){const s=sc(k),t=target(k);return s.a>=t||s.b>=t;}
function BR_KEYS(){ return NP>=4 ? ['sf1','sf2','third','final'] : (NP===3 ? ['final'] : []); }
function allKeys(){ return [...POULE.map((_,i)=>'p'+i), ...BR_KEYS()]; }
function fitSetup(){
  while(NAMES.length<NP) NAMES.push('');
  NAMES.length = NP;
  while(PICK.length<NP) PICK.push([]);
  PICK.length = NP;
}

// Calendrier de poule : méthode du cercle, chacun joue contre tous une fois
function genPoule(n){
  let ids = [...Array(n).keys()];
  if(n % 2) ids.push(null);
  const m = ids.length, pairs = [], rounds = [];
  for(let r=0; r<m-1; r++){
    for(let i=0; i<m/2; i++){
      const a = ids[i], b = ids[m-1-i];
      if(a!==null && b!==null){ pairs.push([a,b]); rounds.push(r+1); }
    }
    ids = [ids[0], ids[m-1], ...ids.slice(1, m-1)];
  }
  return {pairs, rounds};
}

// ---------- résultats et classement ----------
function teams(k){
  if(k.startsWith('tb-')){ const [,a,b] = k.split('-'); return [+a,+b]; }
  if(k[0]==='p') return POULE[+k.slice(1)];
  const r = ranking();
  if(!r) return null;
  if(NP===3 && k==='final') return [r[0], r[1]];
  if(NP>=4){
    if(k==='sf1') return [r[0], r[3]];
    if(k==='sf2') return [r[1], r[2]];
    if(k==='final'){ const a=win('sf1'), b=win('sf2'); return (a!=null&&b!=null) ? [a,b] : null; }
    if(k==='third'){ const a=lose('sf1'), b=lose('sf2'); return (a!=null&&b!=null) ? [a,b] : null; }
  }
  return null;
}
function win(k){ if(!done(k)) return null; const t=teams(k); if(!t) return null; return sc(k).a>=target(k) ? t[0] : t[1]; }
function lose(k){ if(!done(k)) return null; const t=teams(k); if(!t) return null; return sc(k).a>=target(k) ? t[1] : t[0]; }

function stats(){
  const st = P.map((_,i)=>({i,pts:0,mw:0,ml:0,gw:0,gl:0}));
  POULE.forEach(([a,b],i)=>{
    const k = 'p'+i, s = sc(k);
    st[a].gw+=s.a; st[a].gl+=s.b; st[b].gw+=s.b; st[b].gl+=s.a;
    if(done(k)){
      if(s.a>=target(k)){ st[a].pts+=3; st[a].mw++; st[b].ml++; }
      else { st[b].pts+=3; st[b].mw++; st[a].ml++; }
    }
  });
  return st;
}

function sortStats(st){
  UNRESOLVED = []; PENDING = [];
  const base = st.slice().sort((x,y)=>(y.pts-x.pts)||((y.gw-y.gl)-(x.gw-x.gl)));
  const out = [];
  let i = 0;
  while(i < base.length){
    let j = i+1;
    while(j < base.length && base[j].pts===base[i].pts && (base[j].gw-base[j].gl)===(base[i].gw-base[i].gl)) j++;
    const run = base.slice(i,j);
    out.push(...(run.length > 1 ? breakTie(run) : run));
    i = j;
  }
  return out;
}

// Toutes les paires d'un groupe, pour le mini-tournoi de départage
function pairKeys(ids){
  const out = [];
  for(let x=0; x<ids.length; x++) for(let y=x+1; y<ids.length; y++)
    out.push('tb-' + Math.min(ids[x],ids[y]) + '-' + Math.max(ids[x],ids[y]));
  return out;
}
function pouleKeysAmong(ids){
  return POULE.map((_,k)=>k).filter(k => ids.includes(POULE[k][0]) && ids.includes(POULE[k][1])).map(k => 'p'+k);
}

function miniRank(ids, keys){
  const rows = ids.map(id => {
    let pts = 0, gw = 0, gl = 0;
    keys.forEach(k => {
      const [a,b] = teams(k);
      if(!done(k) || (a!==id && b!==id)) return;
      const s = sc(k);
      if(a===id){ gw += s.a; gl += s.b; } else { gw += s.b; gl += s.a; }
      if(win(k) === id) pts += 3;
    });
    return {id, pts, d: gw-gl};
  });
  rows.sort((x,y) => (y.pts-x.pts) || (y.d-x.d));
  return rows;
}

function finalizeTie(g, keys){
  const rows = miniRank(g, keys);
  const out = [];
  let i = 0;
  while(i < rows.length){
    let j = i+1;
    while(j < rows.length && rows[j].pts===rows[i].pts && rows[j].d===rows[i].d) j++;
    let sub = rows.slice(i,j).map(r => r.id);
    if(sub.length > 1){
      UNRESOLVED.push(sub);
      const key = sub.slice().sort((a,b)=>a-b).join('-');
      if(TBO[key]) sub = TBO[key].filter(x => sub.includes(x));
    }
    out.push(...sub);
    i = j;
  }
  return out;
}

function breakTie(run){
  const ids = run.map(s => s.i);
  const rows = miniRank(ids, pouleKeysAmong(ids));
  const out = [];
  let i = 0;
  while(i < rows.length){
    let j = i+1;
    while(j < rows.length && rows[j].pts===rows[i].pts && rows[j].d===rows[i].d) j++;
    let g = rows.slice(i,j).map(r => r.id);
    if(g.length > 1){
      const tb = pairKeys(g);
      if(tb.every(done)) g = finalizeTie(g, tb);
      else PENDING.push(g);
    }
    out.push(...g);
    i = j;
  }
  return out.map(id => run.find(s => s.i === id));
}

function ranking(){
  if(!POULE.every((_,i)=>done('p'+i))) return null;
  const r = sortStats(stats());
  if(PENDING.length) return null;
  return r.map(s => s.i);
}

function tbMove(key, id, dir){
  const g = key.split('-').map(Number);
  const members = sortStats(stats()).filter(s => g.includes(s.i)).map(s => s.i);
  const idx = members.indexOf(id), j = idx + dir;
  if(j < 0 || j >= members.length) return;
  [members[idx], members[j]] = [members[j], members[idx]];
  TBO[key] = members;
  render();
}

function tieHTML(){
  if(!POULE.every((_,i)=>done('p'+i))) return '';
  sortStats(stats());
  let html = '';
  if(PENDING.length){
    const cards = PENDING.flatMap(g => pairKeys(g).map(k => {
      const [a,b] = teams(k);
      return card(k, esc(P[a]) + ' vs ' + esc(P[b]));
    })).join('');
    html += `<h3 style="margin-top:18px">Départage</h3>
      <p class="note">Égalité entre plusieurs joueurs : chacun joue contre les autres. Ces résultats comptent pour le classement.</p>
      <div class="grid">${cards}</div>`;
  }
  if(UNRESOLVED.length){
    html += UNRESOLVED.map(g => {
      const key = g.slice().sort((a,b)=>a-b).join('-');
      const members = sortStats(stats()).filter(s => g.includes(s.i)).map(s => s.i);
      return `<div class="panel" style="margin-top:12px">
        <p class="note" style="margin-top:0">Égalité persistante : classe ces joueurs avec les flèches.</p>
        ${members.map((id,idx) => `<div class="row">
          <span class="name">${dots(id)}${esc(P[id])}</span>
          <div class="score">
            <button ${idx===0?'disabled':''} onclick="tbMove('${key}',${id},-1)" aria-label="Monter">▲</button>
            <button ${idx===members.length-1?'disabled':''} onclick="tbMove('${key}',${id},1)" aria-label="Descendre">▼</button>
          </div></div>`).join('')}
      </div>`;
    }).join('');
  }
  return html;
}

// ---------- saisie des scores ----------
function adjust(k, side, d){
  const cur = {...sc(k)};
  if(d>0 && done(k)) return;
  cur[side] = Math.max(0, Math.min(target(k), cur[side]+d));
  S[k] = cur;
  invalidate(k);
  render();
}
function resetMatch(k){ delete S[k]; delete GL[k]; invalidate(k); render(); }
function invalidate(k){
  if(k[0]==='p' || k.startsWith('tb-')) BR_KEYS().forEach(b => delete S[b]);
  if(k==='sf1' || k==='sf2'){ delete S.final; delete S.third; }
}
function resetAll(){ S = {}; GL = {}; TBO = {}; render(); }

function setFormat(phase, n){
  if(FMT[phase] === n) return;
  FMT[phase] = n;
  const bracket = ['sf1','sf2','final','third'];
  Object.keys(S).forEach(k => {
    const isPoule = (k[0]==='p' || k.startsWith('tb-'));
    if(phase==='p' ? (isPoule || bracket.includes(k)) : bracket.includes(k)) delete S[k];
  });
  Object.keys(GL).forEach(k => {
    const isPoule = (k[0]==='p' || k.startsWith('tb-'));
    if(phase==='p' ? (isPoule || bracket.includes(k)) : bracket.includes(k)) delete GL[k];
  });
  if(phase==='p') TBO = {};
  render();
}

// ---------- lore par partie ----------
function setLore(k, idx, side, val){
  if(!GL[k]) GL[k] = [];
  GL[k][idx] = GL[k][idx] || {a:null, b:null};
  GL[k][idx][side] = (val === '') ? null : Math.max(0, Math.min(99, +val));
  render();
}
function addGame(k){
  const count = Math.max(target(k), (GL[k] || []).length);
  const arr = Array.from({length: count}, (_,i) => (GL[k] && GL[k][i]) || {a:null, b:null});
  GL[k] = arr.concat([{a:null, b:null}]);
  render();
}
function removeGame(k){ if(GL[k] && GL[k].length) GL[k] = GL[k].slice(0,-1); render(); }

function loreHTML(k){
  const t = teams(k);
  const nameA = t ? esc(P[t[0]]) : 'Joueur A';
  const nameB = t ? esc(P[t[1]]) : 'Joueur B';
  const max = 2 * target(k) - 1;                       // BO1 = 1, BO3 = 3, BO5 = 5...
  const saved = GL[k] || [];
  const min = target(k);                               // BO1 : 1, BO3 : 2, BO5 : 3
  const count = Math.max(min, saved.length);
  const games = Array.from({length: count}, (_,i) => saved[i] || {a:null, b:null});
  const totA = games.reduce((s,g) => s + (g.a || 0), 0);
  const totB = games.reduce((s,g) => s + (g.b || 0), 0);
  const rows = games.map((g,idx) => `<div class="lgame">
      <span class="lnum">${max > 1 ? idx+1 : ''}</span>
      ${stepper(k, idx, 'a', g.a)}
      <span class="lvs">vs</span>
      ${stepper(k, idx, 'b', g.b)}
      ${games.length > min ? `<button type="button" class="lx" onclick="removeGameAt('${k}',${idx})" aria-label="Supprimer la partie ${idx+1}">✕</button>` : '<span></span>'}
    </div>`).join('');
  const canAdd = games.length < max;
  return `<div class="lore">
      <div class="lhead"><span class="ltitle">Lore</span><span class="lnames">${nameA} · ${nameB}</span></div>
      ${rows}
      ${canAdd ? `<button type="button" class="ladd" onclick="addGame('${k}')">+ Ajouter une partie</button>` : ''}
      <div class="ltot">Total : <b>${totA}</b> · <b>${totB}</b></div>
    </div>`;
}
function loreByPlayer(){
  const out = P.map(() => ({tot:0, n:0}));
  Object.keys(GL).forEach(k => {
    const t = teams(k);
    if(!t) return;
    (GL[k] || []).forEach(g => {
      if(g.a != null){ out[t[0]].tot += g.a; out[t[0]].n++; }
      if(g.b != null){ out[t[1]].tot += g.b; out[t[1]].n++; }
    });
  });
  return out;
}
function loreStr(x){ return x.n ? (x.tot/x.n).toFixed(1) : '–'; }
function keyLabel(k){
  if(k[0]==='p') return 'Poule ' + (+k.slice(1)+1);
  if(k.startsWith('tb-')) return 'Départage';
  return {sf1:'Demi-finale 1', sf2:'Demi-finale 2', third:'Match 3e place', final:'Finale'}[k] || k;
}

// ---------- lore : compteur par partie ----------
function stepper(k, idx, side, v){
  return `<div class="lstep">
      <button type="button" onclick="stepLore('${k}',${idx},'${side}',-1)" aria-label="Retirer 1">−</button>
      <input type="number" min="0" max="99" inputmode="numeric" value="${v ?? ''}" placeholder="0" onchange="setLore('${k}',${idx},'${side}',this.value)">
      <button type="button" onclick="stepLore('${k}',${idx},'${side}',1)" aria-label="Ajouter 1">+</button>
    </div>`;
}
function stepLore(k, idx, side, d){
  const g = (GL[k] && GL[k][idx]) || {a:null, b:null};
  const cur = g[side] ?? 0;
  setLore(k, idx, side, String(Math.max(0, Math.min(99, cur + d))));
}
function removeGameAt(k, idx){
  const min = target(k);
  const count = Math.max(min, (GL[k] || []).length);
  const arr = Array.from({length: count}, (_,i) => (GL[k] && GL[k][i]) || {a:null, b:null});
  arr.splice(idx, 1);
  GL[k] = arr;
  render();
}

// ---------- feu d'artifice pour le vainqueur ----------
function maybeFireworks(){
  const ci = championIdx();
  if(ci == null) return;
  const key = P.join('|') + '#' + ci;
  if(key === FW_KEY) return;
  FW_KEY = key;
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  setTimeout(() => launchFireworks(P[ci]), 200);

function launchFireworks(name){
  const wrap = document.createElement('div');
  wrap.className = 'fwwrap';
  wrap.innerHTML = `<canvas></canvas>
    <div class="fwmsg">🏆 ${esc(name)}</div>
    <div class="fwhint">Toucher pour fermer</div>`;
  document.body.appendChild(wrap);
  const cv = wrap.querySelector('canvas');
  const ctx = cv.getContext('2d');
  const resize = () => { cv.width = innerWidth; cv.height = innerHeight; };
  resize();
  window.addEventListener('resize', resize);
  const colors = ['#e8b84a','#9b59d0','#3fae5a','#d64550','#3a8fd6','#9aa3b2','#ffffff'];
  let parts = [];
  const burst = (x, y) => {
    const c = colors[(Math.random() * colors.length) | 0];
    for(let i = 0; i < 70; i++){
      const ang = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 5;
      parts.push({x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, life: 60 + Math.random() * 40, t: 0, c});
    }
  };
  const start = performance.now();
  let lastBurst = 0, raf = null, closed = false;
  const frame = now => {
    if(closed) return;
    if(now - start < 6000 && now - lastBurst > 450){
      burst(Math.random() * cv.width, cv.height * (0.15 + Math.random() * 0.45));
      lastBurst = now;
    }
    ctx.clearRect(0, 0, cv.width, cv.height);
    parts = parts.filter(p => p.t < p.life);
    parts.forEach(p => {
      p.t++;
      p.vx *= 0.98; p.vy = p.vy * 0.98 + 0.05;
      p.x += p.vx; p.y += p.vy;
      ctx.globalAlpha = Math.max(0, 1 - p.t / p.life);
      ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;
    if(now - start < 6000 || parts.length) raf = requestAnimationFrame(frame);
  };
  const close = () => {
    closed = true;
    if(raf) cancelAnimationFrame(raf);
    window.removeEventListener('resize', resize);
    wrap.remove();
  };
  wrap.addEventListener('click', close);
  burst(cv.width / 2, cv.height / 3);
  raf = requestAnimationFrame(frame);
}

function card(k,label){
  const t = teams(k);
  if(!t) return `<div class="card pending"><div class="lbl">${label}</div><p class="note">En attente des résultats</p></div>`;
  const s = sc(k), fin = done(k);

  </div>`;

function pct(w,m){ return m ? Math.round(w/m*100)+'%' : '–'; }

function computeStats(){
  const inkSt = INKS.map(() => ({m:0,w:0}));
  const pairSt = {};
  allKeys().forEach(k => {
    if(!done(k)) return;
    const t = teams(k);
    if(!t) return;
    const winner = win(k);
    t.forEach(x => {
      const d = DECKS[x];
      if(!d) return;
      const won = x===winner;
      d.forEach(c => { inkSt[c].m++; if(won) inkSt[c].w++; });
      const pk = d.join('-');
      pairSt[pk] = pairSt[pk] || {c:d, m:0, w:0};
      pairSt[pk].m++; if(won) pairSt[pk].w++;
    });
  });
  return {inkSt, pairSt};
}
function statsHTML(){

  const inkRows = INKS.map((ink,k)=>({k, ...inkSt[k]}))
    .filter(r => r.m>0)
    .sort((a,b)=>(b.w/b.m)-(a.w/a.m) || b.m-a.m)
    .map(r => `<tr>
      <td><span class="dot" style="background-image:url(${INKS[r.k].img})"></span></td>
      <td>${r.m}</td><td>${r.w}</td><td><strong>${pct(r.w,r.m)}</strong></td></tr>`).join('');
  const pairRows = Object.values(pairSt)
    .sort((a,b)=>(b.w/b.m)-(a.w/a.m) || b.m-a.m)
    .map(r => `<tr>
      <td>${r.c.map(k => `<span class="dot" style="background-image:url(${INKS[k].img})"></span>`).join('')}</td>
      <td>${r.m}</td><td>${r.w}</td><td><strong>${pct(r.w,r.m)}</strong></td></tr>`).join('');
  return `
    <h3>Par encre</h3>
    <div class="panel" style="padding:8px 12px;overflow-x:auto;margin-bottom:14px">
      <table>
        <thead><tr><th>Encre</th><th>Matchs</th><th>Victoires</th><th>% victoires</th></tr></thead>
        <tbody>${inkRows || '<tr><td colspan="4" class="note">Aucun deck renseigné</td></tr>'}</tbody>
      </table>
    </div>
    <h3>Par combinaison de deck</h3>
    <div class="panel" style="padding:8px 12px;overflow-x:auto">
      <table>
        <thead><tr><th>Deck</th><th>Matchs</th><th>Victoires</th><th>% victoires</th></tr></thead>
        <tbody>${pairRows || '<tr><td colspan="4" class="note">Aucun deck renseigné</td></tr>'}</tbody>
      </table>
    </div>
    <p class="note">Une victoire compte pour chacune des deux encres du deck. Les matchs de l'arbre et les départages sont inclus.</p>`;
}

function render(){
  const app = document.getElementById('app');
  if(!started || HOME_VIEW){
    fitSetup();
    app.innerHTML = started ? `${resumeHTML()}${historyHTML()}` : `
      <div class="panel setup">
        <div class="pl">
          <label for="np">Nombre de joueurs</label>
          <select id="np" onchange="setNP(+this.value)">
            ${[2,3,4,5,6,7,8].map(n => `<option value="${n}" ${NP===n?'selected':''}>${n} joueurs</option>`).join('')}
          </select>
        </div>
        <h3>Inscription des joueurs</h3>
        ${[...Array(NP).keys()].map(i => `
          <div class="pl">
            <label for="n${i}">Joueur ${i+1}</label>
            <input id="n${i}" type="text" maxlength="24" placeholder="Pseudo ${i+1}" value="${esc(NAMES[i]||'')}" oninput="NAMES[${i}]=this.value">
            <div class="dd">
              <button type="button" class="dd-btn" onclick="toggleMenu(${i})" aria-label="Choisir les 2 encres du deck">
                ${PICK[i].length ? PICK[i].map(k => `<img class="ico" src="${INKS[k].img}" alt="">`).join('') : '<span class="dd-ph">Choisir 2 encres</span>'}
                <span class="caret">▾</span>
              </button>
              ${OPEN===i ? `<div class="dd-menu">${INKS.map((ink,k) => {
                const on = PICK[i].includes(k), dis = !on && PICK[i].length>=2;
                return `<button type="button" class="ico-btn ${on?'on':''}" style="--c:${ink.c}" aria-label="${ink.n}" ${dis?'disabled':''} onclick="togglePick(${i},${k})"><img class="ico" src="${ink.img}" alt=""></button>`;
              }).join('')}</div>` : ''}
            </div>
          </div>`).join('')}
        <button class="btn" onclick="startTournament()">Lancer le tournoi</button>
        <p class="note">Laisse vide un pseudo pour garder « Joueur n ». Choisis 2 encres par deck (optionnel). Le tirage au sort est fait au lancement.</p>
      </div>
      ${historyHTML()}`;
    return;
  }

  const maxR = Math.max(...ROUND);
  const poules = [...Array(maxR).keys()].map(x => {
    const r = x+1;
    const idxs = POULE.map((_,i)=>i).filter(i => ROUND[i]===r);
    return `<h3>Tour ${r}</h3><div class="grid">${idxs.map(i => card('p'+i, esc(P[POULE[i][0]])+' vs '+esc(P[POULE[i][1]]))).join('')}</div>`;
  }).join('<div style="height:14px"></div>');

  const st = sortStats(stats());
  const LB = loreByPlayer();
  const rows = st.map((s,n) => `<tr class="${n<2?'top':''}">
      <td class="l">${n+1}. ${dots(s.i)}${esc(P[s.i])}</td>
      <td><strong>${s.pts}</strong></td>
      <td>${s.mw}-${s.ml}</td>
      <td>${s.gw}-${s.gl}</td>
      <td>${loreStr(LB[s.i])}</td>
    </tr>`).join('');

  let arbre;
  if(NP>=4){
    arbre = `<div class="bracket">
        ${card('sf1','Demi-finale 1 (1er vs 4e)')}
        ${card('sf2','Demi-finale 2 (2e vs 3e)')}
        <div class="full">${card('final','Finale')}</div>
        <div class="full">${card('third','Match pour la 3e place')}</div>
      </div>`;
  } else if(NP===3){
    arbre = `<div class="grid">${card('final','Finale (1er vs 2e)')}</div>`;
  } else {
    arbre = `<p class="note">Avec 2 joueurs, le match de poule désigne le vainqueur.</p>`;
  }

  app.innerHTML = `
    ${isOrganizer() ? `<div class="resetbar"><button class="btn danger" onclick="RESET_CONFIRM=true;render()">Réinitialiser le tournoi</button></div>` : ''}
    ${resetConfirmHTML()}
    <div class="toolbar">
      <button class="btn ghost" onclick="editNames()">Modifier les joueurs</button>
      <label class="fsel">Poule <select onchange="setFormat('p',+this.value)">${[1,3,5,7].map(n => `<option value="${n}" ${FMT.p===n?'selected':''}>BO${n}</option>`).join('')}</select></label>
      <label class="fsel">Arbre <select onchange="setFormat('a',+this.value)">${[1,3,5,7].map(n => `<option value="${n}" ${FMT.a===n?'selected':''}>BO${n}</option>`).join('')}</select></label>
      <button class="btn" onclick="exportCSV()">Exporter (CSV)</button>
      <span id="exp" class="note"></span>
      <span class="note">${DOC ? '● En direct' : 'Mode local'}</span>
    </div>

    <h2>Phase de poule</h2>
    ${poules}

    <h2>Classement</h2>
    <div class="panel" style="padding:8px 12px;overflow-x:auto">
      <table>
        <thead><tr><th class="l">Joueur</th><th>Pts</th><th>Matchs V-D</th><th>Parties</th><th>Lore moy.</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <p class="note">3 points par match gagné (matchs de poule en BO${FMT.p}). Égalité : différence de parties, puis mini-tournoi entre les joueurs à égalité.</p>
    ${tieHTML()}

    <h2>Arbre final</h2>
    ${ranking() ? '' : `<p class="note">L'arbre se remplit automatiquement une fois la poule et les départages terminés.</p>`}
    ${arbre}

    <h2>Statistiques</h2>
    ${statsHTML()}
    ${finishedBanner()}
  `;
  if(started && DOC && !APPLYING) saveRemote();
  maybeFireworks();
}

// ---------- export CSV ----------
async function exportCSV(){
  const msg = document.getElementById('exp');
  const q = v => { const s = String(v ?? ''); return /[",;\r\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
  const L = arr => arr.map(q).join(',');
  const pct2 = (w,m) => m ? Math.round(w/m*100) + '%' : '';
  const nm = k => { const w = win(k); return w == null ? '' : P[w]; };
  const champion = () => {
    if(NP===2){ const r = ranking(); return r ? P[r[0]] : ''; }
    return nm('final');
  };
  const rows = [];

  rows.push(L(['TOURNOI LORCANA']));
  rows.push(L(['Joueurs', P.length]));
  rows.push(L(['Vainqueur', champion()]));
  rows.push('');
  rows.push(L(['JOUEURS','Encre 1','Encre 2']));
  P.forEach((n,i) => rows.push(L([n, DECKS[i] ? INKS[DECKS[i][0]].n : '', DECKS[i] ? INKS[DECKS[i][1]].n : ''])));
  rows.push('');
  rows.push(L(['POULE','Tour','Joueur A','Joueur B','Score A','Score B','Vainqueur']));
  POULE.forEach(([a,b],i) => {
    const s = sc('p'+i);
    rows.push(L(['Match '+(i+1), ROUND[i], P[a], P[b], s.a, s.b, nm('p'+i)]));
  });
  rows.push('');
  rows.push(L(['ARBRE','Phase','Joueur A','Joueur B','Score A','Score B','Vainqueur']));
  [['sf1','Demi-finale 1'],['sf2','Demi-finale 2'],['third','Match pour la 3e place'],['final','Finale']]
    .filter(([k]) => BR_KEYS().includes(k))
    .forEach(([k,label]) => {
      const t = teams(k), s = sc(k);
      rows.push(L([label, '', t ? P[t[0]] : '', t ? P[t[1]] : '', s.a, s.b, nm(k)]));
    });
  rows.push('');
  rows.push(L(['CLASSEMENT','Rang','Joueur','Points','Matchs V','Matchs D','Parties V','Parties D','Lore moy.']));
  const LB = loreByPlayer();
  sortStats(stats()).forEach((s,n) => rows.push(L(['', n+1, P[s.i], s.pts, s.mw, s.ml, s.gw, s.gl, loreStr(LB[s.i])])));
  rows.push('');
  rows.push(L(['LORE PAR PARTIE','Match','Partie','Joueur A','Lore A','Joueur B','Lore B']));
  Object.keys(GL).sort().forEach(k => {
    const t = teams(k);
    (GL[k] || []).forEach((g,idx) => rows.push(L([keyLabel(k), idx+1, t ? P[t[0]] : '', g.a ?? '', t ? P[t[1]] : '', g.b ?? ''])));
  });
  rows.push('');
  rows.push(L(['LORE JOUEURS','Joueur','Lore total','Parties','Lore moy.']));
  LB.forEach((x,i) => rows.push(L(['', P[i], x.tot, x.n, loreStr(x)])));
  rows.push('');
  const {inkSt, pairSt} = computeStats();
  rows.push(L(['STATS PAR ENCRE','Encre','Matchs','Victoires','% victoires']));
  INKS.forEach((ink,k) => { if(inkSt[k].m) rows.push(L(['', ink.n, inkSt[k].m, inkSt[k].w, pct2(inkSt[k].w, inkSt[k].m)])); });
  rows.push('');
  rows.push(L(['STATS PAR DECK','Deck','Matchs','Victoires','% victoires']));
  Object.values(pairSt).forEach(r => rows.push(L(['', r.c.map(k => INKS[k].n).join(' + '), r.m, r.w, pct2(r.w, r.m)])));

  const csv = '\ufeff' + rows.join('\r\n');
  if(!DL){
    const blob = new Blob([csv], {type: 'text/csv;charset=utf-8'});
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'tournoi-lorcana.csv';
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(link.href), 1000);
    if(msg) msg.textContent = 'Fichier exporté.';
    return;
  }
  try {
    await DL.save({filename: 'tournoi-lorcana.csv', data: csv});
    if(msg) msg.textContent = 'Fichier exporté.';
  } catch(e) {
    if(msg) msg.textContent = (e && e.code === 'declined') ? '' : 'Export indisponible ici.';
  }
}

render();
</script>
